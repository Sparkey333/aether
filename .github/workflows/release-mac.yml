name: Release macOS (sign + notarize)

# Produces a downloadable .dmg. When the Apple secrets are present it is fully
# signed, notarized and stapled (no Gatekeeper warning). When they are not, it
# still builds an UNSIGNED .dmg so you can test locally — see docs/RELEASE.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.1). Defaults to a rolling mac-latest."
        required: false
        default: "mac-latest"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14 # Apple Silicon
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci || npm install

      # ---- Code signing identity (skipped when secrets are absent) ----
      - name: Import Developer ID certificate
        if: ${{ env.APPLE_CERTIFICATE != '' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN=build.keychain
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE" | base64 --decode > cert.p12
          security import cert.p12 -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain
          rm -f cert.p12
          echo "Identities available:"; security find-identity -v -p codesigning

      - name: Build, sign and notarize
        env:
          # Signing — set these repo secrets to get a notarized build.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Notarization — App Store Connect API key (preferred).
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ github.workspace }}/apple_api_key.p8
          # …or Apple ID + app-specific password (fallback).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -n "${{ secrets.APPLE_API_KEY_CONTENT }}" ]; then
            printf '%s' "${{ secrets.APPLE_API_KEY_CONTENT }}" > "$APPLE_API_KEY_PATH"
          fi
          if [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "::warning::No Apple secrets set — building an UNSIGNED dmg (Gatekeeper will warn on open)."
          fi
          # Tauri notarizes automatically when the Apple env vars are present.
          npm run tauri:build -- --target aarch64-apple-darwin

      - name: Verify signature + notarization
        continue-on-error: true
        run: |
          APP=$(find src-tauri/target -name "Aether.app" -maxdepth 6 | head -1)
          DMG=$(find src-tauri/target -name "*.dmg" -maxdepth 6 | head -1)
          echo "app=$APP"; echo "dmg=$DMG"
          if [ -n "$APP" ]; then
            codesign --verify --deep --strict --verbose=2 "$APP" || true
            spctl --assess --type execute --verbose "$APP" || true
          fi
          if [ -n "$DMG" ]; then
            xcrun stapler validate "$DMG" || echo "not stapled (expected for unsigned builds)"
            shasum -a 256 "$DMG"
          fi

      - name: Collect artifacts
        id: collect
        run: |
          mkdir -p dist
          find src-tauri/target -name "*.dmg" -maxdepth 6 -exec cp {} dist/ \;
          ls -lh dist
          echo "dmg=$(ls dist/*.dmg | head -1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: aether-macos-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          name: Aether ${{ github.event_name == 'push' && github.ref_name || 'latest Mac build' }}
          prerelease: ${{ github.event_name != 'push' }}
          files: dist/*.dmg
          body: |
            Apple-silicon (aarch64) build of Aether.

            **New:** the **Construct** sparring-program tab and **Clone Studio**
            (camera capture for building your own fighter), plus the playable
            Sparring Arena at `public/play/`.

            Download the `.dmg`, drag to Applications, open.
            Signed + notarized builds open with no Gatekeeper warning; unsigned
            dev builds need right-click → Open the first time.
