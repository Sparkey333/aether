[package]
name = "glade"
version = "0.1.0"
description = "GLADE — a garden you tend, a friend you raise."
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "glade_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
