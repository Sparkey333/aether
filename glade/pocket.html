<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#0d1b2a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Pocket Glade" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons-pwa/icon-192.png" />
<title>Pocket Glade</title>
<style>
  :root{ --ink:#f3efe6; --soft:rgba(243,239,230,.7); --panel:rgba(12,18,28,.5); --edge:rgba(243,239,230,.14);
    --solar:#ffce6b; --lunar:#9fd0ff; --verdant:#9be3a2; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:#06080d; color:var(--ink);
    font-family: ui-rounded,"Hiragino Maru Gothic ProN","Quicksand","Segoe UI",system-ui,sans-serif;
    user-select:none; display:flex; align-items:center; justify-content:center; overflow:hidden; }

  /* the "device": a cozy pocket frame on desktop, full-bleed on phones */
  #device{ position:relative; width:min(420px,100vw); height:min(860px,100vh); background:#0d1b2a;
    border-radius:34px; overflow:hidden; box-shadow:0 24px 80px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.05); }
  @media (max-width:430px){ #device{ width:100vw; height:100dvh; border-radius:0; } }

  #pcanvas{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }

  /* header */
  #hdr{ position:absolute; top:0; left:0; right:0; padding:14px 16px calc(14px + env(safe-area-inset-top));
    display:flex; justify-content:space-between; align-items:flex-start; z-index:4; pointer-events:none; }
  #hdr .nm{ font-size:17px; font-weight:600; text-shadow:0 1px 8px rgba(0,0,0,.6); }
  #hdr .sub{ font-size:11px; color:var(--soft); margin-top:1px; text-shadow:0 1px 6px rgba(0,0,0,.6); }
  .dot{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; box-shadow:0 0 9px currentColor; vertical-align:middle; }
  #hdr .right{ text-align:right; font-size:11px; color:var(--soft); }
  #drops{ color:#bdecff; font-size:13px; }

  /* carry ribbon */
  #carry{ position:absolute; top:calc(54px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    font-size:11px; color:var(--soft); background:var(--panel); padding:4px 12px; border-radius:11px;
    border:1px solid var(--edge); backdrop-filter:blur(6px); z-index:4; pointer-events:none; white-space:nowrap; }

  /* the action bar */
  #bar{ position:absolute; left:0; right:0; bottom:0; padding:12px 14px calc(14px + env(safe-area-inset-bottom));
    display:flex; gap:9px; z-index:4; }
  .act{ flex:1; padding:13px 6px; border-radius:16px; background:var(--panel); border:1px solid var(--edge);
    backdrop-filter:blur(8px); color:var(--ink); font:inherit; font-size:12px; cursor:pointer; transition:.15s; text-align:center; }
  .act .ico{ font-size:18px; display:block; margin-bottom:3px; }
  .act .cap{ font-size:9px; color:var(--soft); display:block; margin-top:2px; }
  .act:active{ transform:scale(.95); }
  .act:disabled{ opacity:.4; cursor:default; }

  /* treat picker (slides up) */
  #treats{ position:absolute; left:10px; right:10px; bottom:calc(96px + env(safe-area-inset-bottom));
    display:flex; gap:8px; justify-content:center; flex-wrap:wrap; z-index:5; opacity:0; pointer-events:none; transition:.22s; }
  #treats.show{ opacity:1; pointer-events:auto; }
  .tr{ width:48px; height:58px; border-radius:13px; background:var(--panel); border:1px solid var(--edge);
    backdrop-filter:blur(8px); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; cursor:pointer; }
  .tr:active{ transform:scale(.94); }
  .tr .lb{ font-size:8px; color:var(--soft); }

  /* while-you-were-away card */
  #away{ position:absolute; inset:0; z-index:9; display:flex; align-items:center; justify-content:center;
    background:rgba(6,10,18,.55); backdrop-filter:blur(3px); transition:opacity .5s; }
  #away .card{ width:78%; max-width:320px; background:rgba(14,24,38,.94); border:1px solid var(--edge);
    border-radius:20px; padding:20px; text-align:center; box-shadow:0 16px 50px rgba(0,0,0,.5); }
  #away h2{ margin:0 0 4px; font-size:18px; font-weight:600; }
  #away .when{ color:var(--soft); font-size:12px; margin-bottom:12px; }
  #away ul{ list-style:none; margin:0 0 14px; padding:0; text-align:left; font-size:13px; color:var(--ink); }
  #away li{ padding:3px 0; }
  #away li b{ color:var(--verdant); }
  #away button{ font:inherit; font-size:13px; padding:11px 22px; border-radius:14px; cursor:pointer;
    background:rgba(243,239,230,.1); border:1px solid var(--edge); color:var(--ink); }
  #away button:active{ transform:scale(.96); }

  #toasts{ position:absolute; top:84px; left:50%; transform:translateX(-50%); z-index:7; pointer-events:none;
    display:flex; flex-direction:column; gap:6px; align-items:center; }
  .toast{ font-size:12px; background:rgba(12,18,28,.62); border:1px solid var(--edge); padding:6px 13px;
    border-radius:13px; backdrop-filter:blur(6px); text-shadow:0 1px 6px rgba(0,0,0,.5); animation:rise 3.6s ease forwards; }
  @keyframes rise{ 0%{opacity:0;transform:translateY(6px)} 14%{opacity:1;transform:none} 80%{opacity:1} 100%{opacity:0;transform:translateY(-6px)} }

  #toFull{ position:absolute; bottom:calc(96px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    font-size:11px; color:var(--soft); text-decoration:none; background:var(--panel); padding:5px 12px; border-radius:11px;
    border:1px solid var(--edge); backdrop-filter:blur(6px); z-index:4; }
  .hidden{ display:none !important; }
</style>
</head>
<body>
<div id="device">
  <canvas id="pcanvas"></canvas>

  <div id="hdr">
    <div>
      <div class="nm" id="nm">Pocket Glade</div>
      <div class="sub"><span class="dot" id="dot" style="color:#9be3a2"></span><span id="state">with you</span></div>
    </div>
    <div class="right">
      <div id="clock">dawn</div>
      <div id="drops">✦ 0</div>
    </div>
  </div>

  <div id="carry">🌱 carrying <span id="carryName">your Bloomling</span></div>

  <a id="toFull" href="index.html">open the full Glade ↗</a>

  <div id="treats"></div>

  <div id="bar">
    <button class="act" id="aPet"><span class="ico">🤚</span>pet<span class="cap" id="capPet"></span></button>
    <button class="act" id="aGather"><span class="ico">✦</span>gather<span class="cap" id="capGather"></span></button>
    <button class="act" id="aTreat"><span class="ico">🍃</span>treat<span class="cap" id="capTreat"></span></button>
  </div>

  <div id="toasts"></div>

  <div id="away" class="hidden">
    <div class="card">
      <h2 id="awayTitle">welcome back</h2>
      <div class="when" id="awayWhen"></div>
      <ul id="awayList"></ul>
      <button id="awayOk">say hello 🌱</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* ============================================================================
   POCKET GLADE — the companion layer. A tiny, cozy garden that shares the SAME
   Bloomling and the SAME save (localStorage 'glade.save.v1') as the full game.
   Pet it, gather dewdrops, slip it a treat — it carries home. Offline-first;
   installable to a phone home screen (PWA). The creature is in your life.
   ========================================================================== */

const SAVE_KEY="glade.save.v1";
const SECONDS_PER_DAY=150, DAY_VISUAL=90, OFFLINE_CAP_DAYS=1.4;

/* check-in caps — Pocket is for gentle maintenance; the home garden does the deep shaping */
const CAP={ pet:6, gather:20, treat:4 };
let used={ pet:0, gather:0, treat:0 };

const ESSENCES=[
  { id:"sunfruit",  name:"Sunfruit",   align:"solar",   stat:"vigor", trait:"crown",   hue:42,  mood:8,  feed:34, color:"#ffb648" },
  { id:"emberbloom",name:"Emberbloom", align:"solar",   stat:"wit",   trait:"horn",    hue:30,  mood:6,  feed:20, color:"#ff8a5c" },
  { id:"moonberry", name:"Moonberry",  align:"lunar",   stat:"grace", trait:"mothwing",hue:212, mood:8,  feed:30, color:"#8fb6ff" },
  { id:"dewlight",  name:"Dewlight",   align:"lunar",   stat:"wit",   trait:"glow",    hue:196, mood:7,  feed:22, color:"#bfe6ff" },
  { id:"greenleaf", name:"Greenleaf",  align:"verdant", stat:"heart", trait:"ears",    hue:128, mood:9,  feed:32, color:"#86d98e" },
  { id:"deeproot",  name:"Deeproot",   align:"verdant", stat:"vigor", trait:"tail",    hue:96,  mood:5,  feed:38, color:"#7fae6a" },
  { id:"dewdrop",   name:"Dewdrop",    align:"neutral", stat:"grace", trait:"fins",    hue:188, mood:12, feed:14, color:"#a9e8ea" },
  { id:"honeydrop", name:"Honeydrop",  align:"neutral", stat:"heart", trait:"freckle", hue:48,  mood:14, feed:18, color:"#ffd980" },
];
const ESS_BY_ID=Object.fromEntries(ESSENCES.map(e=>[e.id,e]));
const ALIGN_COLOR={ solar:"#ffce6b", lunar:"#9fd0ff", verdant:"#9be3a2", neutral:"#e6dfcf" };
const STAT_COLOR={ heart:"#ff9eb5", grace:"#a9e8ea", vigor:"#ffce6b", wit:"#bfa9ff" };

const clamp=(v,a,b)=> v<a?a:(v>b?b:v);
const lerp=(a,b,t)=> a+(b-a)*t;
const mix=(a,b,t)=>[Math.round(lerp(a[0],b[0],t)),Math.round(lerp(a[1],b[1],t)),Math.round(lerp(a[2],b[2],t))];
const rgb=a=>"rgb("+a[0]+","+a[1]+","+a[2]+")";
const rgba=(a,al)=>"rgba("+a[0]+","+a[1]+","+a[2]+","+al+")";
const nowMs=()=>Date.now();
function mulberry32(a){ return function(){ a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296; }; }

/* ============================== STATE / SAVE ============================== */
let G=null, away=0, awayEffects=[];

function freshBloomling(){ return { name:"seedling", born:0, age:0, stage:"egg",
  stats:{grace:6,vigor:6,wit:6,heart:6}, soul:0, align:{solar:0,lunar:0,verdant:0}, alignment:"verdant",
  traits:[], mood:72, hunger:24, memory:{pets:0,feeds:0,fav:null,favCount:0,returns:0,everbloomSeed:0,lastSeen:0},
  everbloom:false, _fed:{} }; }
function newGame(){ return { createdReal:nowMs(), lastReal:nowMs(), creatureSeconds:0, dewdrops:0,
  bloomling:freshBloomling(), garden:{bloom:1,level:1,flowers:[],blights:[],tendCredit:0,season:0},
  settings:{sound:true,cozy:false}, firstRun:true }; }

function loadRaw(){ try{ const r=localStorage.getItem(SAVE_KEY); return r?JSON.parse(r):null; }catch(e){ return null; } }
function adopt(s){ // normalize a loaded save into a full G
  const b=Object.assign(freshBloomling(), s.bloomling||{});
  b.stats=Object.assign({grace:6,vigor:6,wit:6,heart:6}, (s.bloomling||{}).stats||{});
  b.align=Object.assign({solar:0,lunar:0,verdant:0}, (s.bloomling||{}).align||{});
  b.memory=Object.assign({pets:0,feeds:0,fav:null,favCount:0,returns:0,everbloomSeed:0,lastSeen:0}, (s.bloomling||{}).memory||{});
  b.traits=(s.bloomling||{}).traits||[]; b._fed=(s.bloomling||{})._fed||{};
  return { createdReal:s.createdReal||nowMs(), lastReal:s.lastReal||nowMs(), creatureSeconds:s.creatureSeconds||0,
    dewdrops:s.dewdrops||0, bloomling:b, garden:Object.assign({bloom:1,level:1,flowers:[],blights:[],tendCredit:0,season:0}, s.garden||{}),
    settings:Object.assign({sound:true,cozy:false}, s.settings||{}), firstRun:!!s.firstRun }; }

let suppressStorage=false;
function save(){ try{ G.lastReal=nowMs();
  const b=G.bloomling; const {x,y,vx,vy,bob,blink,blinking,petGlow,squash,reach,_t,...bl}=b;
  const slim={ createdReal:G.createdReal, lastReal:G.lastReal, creatureSeconds:G.creatureSeconds, dewdrops:G.dewdrops||0,
    bloomling:bl, garden:{...G.garden, flowers:(G.garden.flowers||[]).slice(0,60)}, settings:G.settings, firstRun:G.firstRun };
  suppressStorage=true; localStorage.setItem(SAVE_KEY, JSON.stringify(slim)); setTimeout(()=>suppressStorage=false,50);
}catch(e){} }

/* offline catch-up — mirrors the home garden so the creature ages consistently */
function applyOfflineTime(){
  const elapsed=Math.max(0,(nowMs()-G.lastReal)/1000); let d=elapsed;
  const cap=OFFLINE_CAP_DAYS*SECONDS_PER_DAY; if(d>cap) d=cap+Math.sqrt(d-cap);
  G.creatureSeconds+=d; const b=G.bloomling;
  const ageBefore=b.age, hungerBefore=b.hunger, moodBefore=b.mood;
  if(b.stage!=="egg"||b.age>0) b.age+=d/SECONDS_PER_DAY;
  const awayDays=elapsed/SECONDS_PER_DAY;
  b.hunger=clamp(b.hunger+awayDays*22,0,100);
  if(elapsed>60) b.mood=clamp(b.mood-awayDays*16,8,100);
  awayEffects=[];
  if(b.age-ageBefore>0.04) awayEffects.push("it grew a little older");
  if(b.hunger-hungerBefore>10) awayEffects.push("it's gotten <b>peckish</b>");
  if(moodBefore-b.mood>10) awayEffects.push("it <b>missed you</b>");
  return elapsed;
}

/* ============================== CANVAS =================================== */
const cv=document.getElementById("pcanvas"), ctx=cv.getContext("2d");
let W=0,H=0,DPR=1,GROUND=0;
function resize(){ const r=cv.getBoundingClientRect(); DPR=Math.min(window.devicePixelRatio||1,2);
  W=r.width; H=r.height; cv.width=Math.floor(W*DPR); cv.height=Math.floor(H*DPR); ctx.setTransform(DPR,0,0,DPR,0,0);
  GROUND=H*0.70; }
window.addEventListener("resize", resize);

function dayPhase(){ return (G.creatureSeconds % DAY_VISUAL)/DAY_VISUAL; }
function isNight(p){ return p>0.55||p<0.05; }
function clockLabel(p){ return p<0.10?"dawn":p<0.22?"morning":p<0.34?"midday":p<0.5?"afternoon":p<0.62?"dusk":p<0.8?"evening":"deep night"; }
const SKY={ dawn:[[58,72,110],[210,150,150]], noon:[[90,150,210],[200,225,235]], dusk:[[60,60,110],[235,150,110]], night:[[10,16,34],[28,40,72]] };
function skyColors(p){ let top,bot;
  if(p<0.25){const t=p/0.25;top=mix(SKY.dawn[0],SKY.noon[0],t);bot=mix(SKY.dawn[1],SKY.noon[1],t);}
  else if(p<0.5){const t=(p-0.25)/0.25;top=mix(SKY.noon[0],SKY.dusk[0],t);bot=mix(SKY.noon[1],SKY.dusk[1],t);}
  else if(p<0.75){const t=(p-0.5)/0.25;top=mix(SKY.dusk[0],SKY.night[0],t);bot=mix(SKY.dusk[1],SKY.night[1],t);}
  else{const t=(p-0.75)/0.25;top=mix(SKY.night[0],SKY.dawn[0],t);bot=mix(SKY.night[1],SKY.dawn[1],t);}
  return [top,bot]; }

/* ============================== CREATURE ================================= */
function bloomColor(b){ const a=b.alignment;
  return a==="solar"?[255,206,107]:a==="lunar"?[159,208,255]:a==="verdant"?[155,227,162]:[230,223,207]; }
function stageSize(b){ const base={egg:30,child:28,sprout:36,adult:46,elder:48}[b.stage]||30; return base*(b.everbloom?1.15:1); }
function hsl(h){ return "hsl("+h+",70%,70%)"; }

function drawTraitLayer(b,size,col,layer){
  for(const t of b.traits){ const tc=hsl(t.hue);
    if(layer==="back"){
      if(t.kind==="mothwing"){ wings(size,tc,true); }
      else if(t.kind==="featherwing"){ wings(size,tc,false); }
      else if(t.kind==="tail"){ ctx.strokeStyle=rgb(mix(col,[80,120,80],0.3)); ctx.lineWidth=size*0.12; ctx.lineCap="round";
        const w=Math.sin(b._t*3)*size*0.2; ctx.beginPath(); ctx.moveTo(0,size*0.7); ctx.quadraticCurveTo(-size*0.6+w,size*1.2,-size*0.9+w,size*0.7); ctx.stroke();
        ctx.fillStyle=tc; ctx.beginPath(); ctx.arc(-size*0.9+w,size*0.7,size*0.16,0,6.28); ctx.fill(); }
    } else {
      if(t.kind==="crown"){ const n=6; for(let i=0;i<n;i++){ const a=-Math.PI*0.5+(i-(n-1)/2)*0.32;
        ctx.save(); ctx.rotate(a); ctx.translate(0,-size*1.05); ctx.fillStyle=tc; ctx.beginPath(); ctx.ellipse(0,0,size*0.16,size*0.34,0,0,6.28); ctx.fill(); ctx.restore(); }
        ctx.fillStyle="rgba(255,235,170,.95)"; ctx.beginPath(); ctx.arc(0,-size*1.02,size*0.14,0,6.28); ctx.fill(); }
      else if(t.kind==="horn"){ ctx.fillStyle=rgb(mix([255,255,255],[180,150,90],0.6));
        for(const s of[-1,1]){ ctx.beginPath(); ctx.moveTo(s*size*0.32,-size*0.9); ctx.lineTo(s*size*0.5,-size*1.45); ctx.lineTo(s*size*0.18,-size*0.95); ctx.closePath(); ctx.fill(); } }
      else if(t.kind==="ears"){ ctx.fillStyle=tc; for(const s of[-1,1]){ ctx.save(); ctx.translate(s*size*0.55,-size*0.7); ctx.rotate(s*0.5);
        ctx.beginPath(); ctx.ellipse(0,0,size*0.16,size*0.4,0,0,6.28); ctx.fill(); ctx.restore(); } }
      else if(t.kind==="fins"){ ctx.fillStyle=rgba([120,210,210],0.85); for(const s of[-1,1]){ ctx.save(); ctx.translate(s*size*0.78,size*0.1); ctx.rotate(s*0.4);
        ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(s*size*0.4,-size*0.2,s*size*0.5,size*0.25); ctx.quadraticCurveTo(s*size*0.2,size*0.25,0,0); ctx.fill(); ctx.restore(); } }
      else if(t.kind==="glow"){ ctx.save(); ctx.globalCompositeOperation="lighter"; const g=ctx.createRadialGradient(0,0,size*0.5,0,0,size*1.8);
        g.addColorStop(0,rgba([150,220,255],0.4)); g.addColorStop(1,rgba([150,220,255],0)); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,size*1.8,0,6.28); ctx.fill(); ctx.restore(); }
      else if(t.kind==="freckle"){ ctx.fillStyle="rgba(255,180,140,.7)"; ctx.beginPath(); ctx.arc(size*0.5,size*0.05,size*0.06,0,6.28); ctx.arc(-size*0.5,size*0.05,size*0.06,0,6.28); ctx.fill(); }
    }
  }
}
function wings(size,tc,moth){ for(const s of[-1,1]){ ctx.save(); ctx.translate(s*size*0.5,-size*0.2); ctx.rotate(s*(0.2+Math.sin(G.creatureSeconds*3)*0.08));
  ctx.fillStyle=moth?"rgba(220,230,255,.7)":tc; ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(s*size*1.2,-size*0.9,s*size*1.5,-size*0.1);
  ctx.quadraticCurveTo(s*size*1.2,size*0.5,0,size*0.3); ctx.closePath(); ctx.fill();
  if(moth){ ctx.fillStyle="rgba(255,255,255,.5)"; ctx.beginPath(); ctx.arc(s*size*1.0,-size*0.2,size*0.12,0,6.28); ctx.fill(); } ctx.restore(); } }

function drawEgg(b,size){ const wob=Math.sin(b._t*3)*0.04; ctx.save(); ctx.rotate(wob);
  const col=bloomColor(b); const g=ctx.createLinearGradient(0,-size,0,size); g.addColorStop(0,"#eef3e2"); g.addColorStop(1,rgb(mix(col,[200,210,180],0.4)));
  ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(0,0,size*0.82,size*1.05,0,0,6.28); ctx.fill();
  ctx.strokeStyle=rgba(col,0.6); ctx.lineWidth=2; ctx.beginPath(); ctx.ellipse(0,0,size*0.82,size*1.05,0,0,6.28); ctx.stroke(); ctx.restore(); }

function drawMote(b,cx,cy,size){ const my=cy-size*1.7+Math.sin(b._t*1.6)*4; const col=ALIGN_COLOR[b.alignment]||"#e6dfcf";
  ctx.save(); ctx.translate(cx,my); ctx.shadowColor=col; ctx.shadowBlur=16; ctx.fillStyle=col; const m=b.mood,hu=b.hunger;
  if(hu>72){ ctx.globalAlpha=0.5+0.3*Math.sin(b._t*5); ctx.beginPath(); ctx.moveTo(0,-7); ctx.bezierCurveTo(6,0,4,8,0,8); ctx.bezierCurveTo(-4,8,-6,0,0,-7); ctx.fill(); }
  else if(m>66){ ctx.beginPath(); ctx.moveTo(0,3); ctx.bezierCurveTo(-7,-6,-9,4,0,9); ctx.bezierCurveTo(9,4,7,-6,0,3); ctx.fill(); }
  else if(m<34){ ctx.globalAlpha=0.55; ctx.beginPath(); ctx.arc(0,0,5,0,6.28); ctx.fill(); }
  else { ctx.beginPath(); ctx.arc(0,0,6,0,6.28); ctx.fill(); }
  ctx.restore(); }

function drawCreature(dt){ const b=G.bloomling;
  if(b.x===undefined){ b.x=W/2; b.bob=0; b.blink=2; b.blinking=false; b.petGlow=0; b.squash=0; b._t=0; }
  b._t+=dt;
  b.blink-=dt; if(b.blink<0){ if(b.blinking){ b.blinking=false; b.blink=2+Math.random()*4; } else { b.blinking=true; b.blink=0.12; } }
  if(b.petGlow>0) b.petGlow-=dt; if(b.squash>0) b.squash-=dt*2;
  const size=stageSize(b)*Math.min(1.2, W/360);
  const cx=W/2, cy=GROUND+18 + Math.sin(b._t*2.2)*4 - size*0.5;
  // shadow
  ctx.save(); ctx.translate(cx,GROUND+30); ctx.scale(1,0.32); ctx.fillStyle="rgba(0,0,0,.22)"; ctx.beginPath(); ctx.arc(0,0,size*0.7,0,6.28); ctx.fill(); ctx.restore();
  ctx.save(); ctx.translate(cx,cy);
  if(b.stage==="egg"){ drawEgg(b,size); ctx.restore(); drawMote(b,cx,cy,size); return; }
  const col=bloomColor(b), squash=1-b.squash*0.18;
  drawTraitLayer(b,size,col,"back");
  ctx.save(); ctx.scale(1/Math.max(0.5,squash),squash);
  const grad=ctx.createLinearGradient(0,-size,0,size); grad.addColorStop(0,rgb(mix(col,[255,255,255],0.35))); grad.addColorStop(1,rgb(mix(col,[60,60,80],0.18)));
  ctx.fillStyle=grad; ctx.beginPath(); ctx.moveTo(0,-size*1.15); ctx.bezierCurveTo(size*0.9,-size,size*1.05,size*0.5,0,size);
  ctx.bezierCurveTo(-size*1.05,size*0.5,-size*0.9,-size,0,-size*1.15); ctx.fill();
  ctx.fillStyle="rgba(255,255,255,.22)"; ctx.beginPath(); ctx.ellipse(-size*0.35,-size*0.2,size*0.28,size*0.4,0,0,6.28); ctx.fill(); ctx.restore();
  if(b.everbloom){ ctx.save(); ctx.globalCompositeOperation="lighter"; const eg=ctx.createRadialGradient(0,0,size*0.4,0,0,size*2.4);
    eg.addColorStop(0,"rgba(255,245,210,.5)"); eg.addColorStop(1,"rgba(255,245,210,0)"); ctx.fillStyle=eg; ctx.beginPath(); ctx.arc(0,0,size*2.4,0,6.28); ctx.fill(); ctx.restore(); }
  drawTraitLayer(b,size,col,"front");
  // face
  const eyeY=-size*0.12, eyeX=size*0.30; ctx.fillStyle="#2a2433";
  if(b.blinking){ ctx.strokeStyle="#2a2433"; ctx.lineWidth=size*0.06; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(eyeX-size*0.1,eyeY); ctx.lineTo(eyeX+size*0.1,eyeY); ctx.moveTo(-eyeX-size*0.1,eyeY); ctx.lineTo(-eyeX+size*0.1,eyeY); ctx.stroke(); }
  else { const er=size*0.12; ctx.beginPath(); ctx.arc(eyeX,eyeY,er,0,6.28); ctx.arc(-eyeX,eyeY,er,0,6.28); ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.85)"; ctx.beginPath(); ctx.arc(eyeX+er*0.3,eyeY-er*0.3,er*0.35,0,6.28); ctx.arc(-eyeX+er*0.3,eyeY-er*0.3,er*0.35,0,6.28); ctx.fill(); }
  ctx.strokeStyle="#2a2433"; ctx.lineWidth=size*0.05; ctx.lineCap="round"; const m=b.mood; ctx.beginPath();
  if(m>62) ctx.arc(0,size*0.12,size*0.18,0.15*Math.PI,0.85*Math.PI);
  else if(m>38){ ctx.moveTo(-size*0.1,size*0.2); ctx.lineTo(size*0.1,size*0.2); }
  else ctx.arc(0,size*0.34,size*0.16,1.15*Math.PI,1.85*Math.PI);
  ctx.stroke(); ctx.restore();
  drawMote(b,cx,cy,size);
  b._cx=cx; b._cy=cy; b._size=size;
}

/* ============================ DEWDROPS + POPS =========================== */
const drops=[], pops=[], bursts=[];
function spawnDrop(x,y){ drops.push({ x:isFinite(x)?x:(40+Math.random()*(W-80)), y:isFinite(y)?y:(H*0.25+Math.random()*H*0.3), ph:Math.random()*6.28, t:0, life:99 }); }
function drawDrops(dt){ for(let i=drops.length-1;i>=0;i--){ const d=drops[i]; d.t+=dt; d.y+=Math.sin(d.t*1.5+d.ph)*9*dt;
  ctx.save(); ctx.translate(d.x,d.y); ctx.shadowColor="rgba(180,240,255,.9)"; ctx.shadowBlur=12; ctx.fillStyle="#e2f6ff";
  const r1=7+Math.sin(d.t*4)*1.5,r2=2.6; ctx.beginPath(); for(let k=0;k<4;k++){ const a=k/4*6.2832; ctx.lineTo(Math.cos(a)*r1,Math.sin(a)*r1); ctx.lineTo(Math.cos(a+0.7854)*r2,Math.sin(a+0.7854)*r2); }
  ctx.closePath(); ctx.fill(); ctx.restore(); } ctx.shadowBlur=0; }
function popText(x,y,t,c,big){ if(!isFinite(x))x=W/2; if(!isFinite(y))y=H/2; pops.push({x,y,vy:-38,text:t,color:c||"#fff",scale:big?1.4:1,life:1.1,t:0}); }
function drawPops(dt){ ctx.textAlign="center"; ctx.textBaseline="middle";
  for(let i=pops.length-1;i>=0;i--){ const p=pops[i]; p.life-=dt; if(p.life<=0){pops.splice(i,1);continue;} p.t+=dt; p.y+=p.vy*dt; p.vy+=44*dt;
    const a=clamp(p.life/1.1,0,1), s=p.scale*(0.7+0.3*Math.min(1,p.t/0.16)); ctx.globalAlpha=a;
    ctx.font="700 "+Math.round(17*s)+"px ui-rounded,Quicksand,system-ui,sans-serif"; ctx.lineWidth=4; ctx.strokeStyle="rgba(18,22,28,.55)"; ctx.strokeText(p.text,p.x,p.y);
    ctx.fillStyle=p.color; ctx.fillText(p.text,p.x,p.y); } ctx.globalAlpha=1; }
function burst(x,y,c){ for(let i=0;i<9;i++){ const a=Math.random()*6.28,s=24+Math.random()*36; bursts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-22,life:0.6,color:c||"#fff"}); } }
function drawBursts(dt){ for(let i=bursts.length-1;i>=0;i--){ const p=bursts[i]; p.life-=dt; if(p.life<=0){bursts.splice(i,1);continue;} p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=60*dt;
  ctx.globalAlpha=clamp(p.life/0.6,0,1); ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,2,0,6.28); ctx.fill(); } ctx.globalAlpha=1; }

/* ============================== AUDIO (gentle) ========================== */
let AC=null,master=null;
function initAudio(){ if(AC) return; try{ AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain(); master.gain.value=G.settings.sound?0.16:0.0001; master.connect(AC.destination); }catch(e){ AC=null; } }
function ping(f){ if(!AC||!G.settings.sound) return; try{ const o=AC.createOscillator(); o.type="triangle"; o.frequency.value=f;
  const g=AC.createGain(); g.gain.value=0.0001; o.connect(g); g.connect(master); const t=AC.currentTime;
  g.gain.exponentialRampToValueAtTime(0.12,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.45); o.start(t); o.stop(t+0.5); }catch(e){} }

/* ============================== ACTIONS ================================= */
function refreshCaps(){ document.getElementById("capPet").textContent=(CAP.pet-used.pet)+" left";
  document.getElementById("capGather").textContent=(CAP.gather-used.gather)+" left";
  document.getElementById("capTreat").textContent=(CAP.treat-used.treat)+" left";
  document.getElementById("aPet").disabled=used.pet>=CAP.pet;
  document.getElementById("aGather").disabled=used.gather>=CAP.gather;
  document.getElementById("aTreat").disabled=used.treat>=CAP.treat; }

function doPet(){ const b=G.bloomling;
  if(b.stage==="egg"){ b.age+=0.02; b.squash=1; burst(W/2,GROUND,"#ffe9c0"); popText(W/2,GROUND-30,"warm ♨","#ffd9a8"); ping(520); save(); return; }
  if(used.pet>=CAP.pet){ toast("it's had plenty of pets — come back later 💗"); return; }
  used.pet++; b.mood=clamp(b.mood+6,0,100); b.stats.heart+=0.03; b.soul+=0.002; b.memory.pets++; b.petGlow=1.2; b.squash=1;
  burst(b._cx||W/2,(b._cy||GROUND)-20,"#ffd9e2"); popText(b._cx||W/2,(b._cy||GROUND)-(b._size||30)*1.2,"＋♥","#ff9eb5"); ping(560+Math.random()*40);
  if(Math.random()<0.25) spawnDrop(b._cx,(b._cy||GROUND)-40);
  refreshCaps(); save(); }

function doGather(){ if(used.gather>=CAP.gather){ toast("pockets full of dewdrops ✦"); return; }
  if(drops.length===0){ spawnDrop(); spawnDrop(); toast("a few dewdrops drift in…"); return; }
  // collect them all (up to the cap)
  let got=0; while(drops.length && used.gather<CAP.gather){ const d=drops.pop(); used.gather++; got++; G.dewdrops=(G.dewdrops||0)+1; burst(d.x,d.y,"#e2f6ff"); }
  popText(W/2,H*0.4,"+"+got+" ✦","#bdecff",true); ping(740); refreshCaps(); updateHud(); save(); }

let treatsOpen=false;
function toggleTreats(){ treatsOpen=!treatsOpen; document.getElementById("treats").classList.toggle("show",treatsOpen); }
function doTreat(id){ const b=G.bloomling;
  if(b.stage==="egg"){ toast("the seed isn't ready to eat — warm it first"); return; }
  if(used.treat>=CAP.treat){ toast("it's full — treats refill next check-in 🍃"); return; }
  const e=ESS_BY_ID[id]; if(!e) return; used.treat++;
  b.hunger=clamp(b.hunger-e.feed*0.25,0,100); b.mood=clamp(b.mood+e.mood*0.5,0,100); b.stats[e.stat]+=0.15; b.soul+=0.004;
  if(e.align!=="neutral") b.align[e.align]=(b.align[e.align]||0)+0.5;
  b._fed=b._fed||{}; b._fed[e.id]=(b._fed[e.id]||0)+1; b.squash=1;
  burst(b._cx||W/2,GROUND,e.color); popText(b._cx||W/2,(b._cy||GROUND)-(b._size||30)*1.3,"＋"+e.stat[0].toUpperCase()+e.stat.slice(1),STAT_COLOR[e.stat]); ping(500);
  recomputeAlignment(); toggleTreats(); refreshCaps(); updateHud(); save(); }

function recomputeAlignment(){ const a=G.bloomling.align, tot=a.solar+a.lunar+a.verdant;
  if(tot<=0){ G.bloomling.alignment="verdant"; return; } let best="verdant",bv=-1;
  for(const k of["solar","lunar","verdant"]) if(a[k]>bv){bv=a[k];best=k;} G.bloomling.alignment=best; }

/* simple growth while pocket is open (keeps the shared creature alive) */
function tick(dt){ const b=G.bloomling; G.creatureSeconds+=dt;
  if(b.stage!=="egg"||b.age>0) b.age+=dt/SECONDS_PER_DAY;
  if(b.stage==="egg"&&b.age>=0.14){ b.stage="child"; b.age=0.15; burst(W/2,GROUND-20,"#cfe9c6"); popText(W/2,GROUND-40,"hatched!","#cfe9c6",true); ping(660); }
  b.hunger=clamp(b.hunger+dt*1.4,0,100);
  const target=70-(b.hunger>60?(b.hunger-60)*0.7:0); b.mood=lerp(b.mood,clamp(target,8,100),1-Math.pow(0.5,dt/8));
  if(drops.length<3 && b.stage!=="egg" && Math.random()<dt*0.10) spawnDrop(); }

/* ============================== HUD ===================================== */
function updateHud(){ const b=G.bloomling;
  document.getElementById("nm").textContent = b.name==="seedling"?(b.stage==="egg"?"a sleeping seed":"a new seedling"):b.name+(b.everbloom?" ✦":"");
  document.getElementById("carryName").textContent = b.name==="seedling"?"your seed":b.name;
  document.getElementById("dot").style.color=ALIGN_COLOR[b.alignment];
  const parts=[]; if(b.stage==="egg") parts.push("a seed, warming"); else { parts.push(b.alignment==="neutral"?"everbloom":b.alignment);
    parts.push(b.hunger>72?"hungry":b.mood>70?"happy":b.mood<35?"lonely":"content"); }
  document.getElementById("state").textContent=parts.join(" · ");
  document.getElementById("drops").textContent="✦ "+(G.dewdrops||0);
  document.getElementById("clock").textContent=clockLabel(dayPhase()); }

let toastT=null;
function toast(m){ const el=document.createElement("div"); el.className="toast"; el.textContent=m; document.getElementById("toasts").appendChild(el); setTimeout(()=>el.remove(),3600); }

/* ============================== RENDER LOOP ============================= */
let lastFrame=0, saveT=0;
function frame(ts){ if(!lastFrame) lastFrame=ts; let dt=(ts-lastFrame)/1000; lastFrame=ts; if(dt>0.1) dt=0.1;
  tick(dt); const p=dayPhase();
  ctx.clearRect(0,0,W,H);
  // sky
  const [top,bot]=skyColors(p); const g=ctx.createLinearGradient(0,0,0,GROUND+30); g.addColorStop(0,rgb(top)); g.addColorStop(1,rgb(bot)); ctx.fillStyle=g; ctx.fillRect(0,0,W,GROUND+30);
  // sun/moon
  const ang=p*Math.PI*2-Math.PI/2, scx=W*0.5+Math.cos(ang)*W*0.42, scy=GROUND*0.55-Math.sin(ang)*GROUND*0.45;
  if(isNight(p)){ ctx.fillStyle="#f3f1e0"; ctx.shadowColor="rgba(220,230,255,.7)"; ctx.shadowBlur=24; ctx.beginPath(); ctx.arc(scx,scy,12,0,6.28); ctx.fill(); ctx.shadowBlur=0;
    for(let i=0;i<36;i++){ const sx=(i*73.3%W), sy=(i*41.7)%(GROUND*0.65); ctx.fillStyle="rgba(255,255,240,"+(0.3+0.5*Math.abs(Math.sin(G.creatureSeconds*0.6+i)))+")"; ctx.fillRect(sx,sy,1.4,1.4); } }
  else { const glow=ctx.createRadialGradient(scx,scy,3,scx,scy,54); glow.addColorStop(0,"rgba(255,244,200,.95)"); glow.addColorStop(1,"rgba(255,244,200,0)"); ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(scx,scy,54,0,6.28); ctx.fill(); ctx.fillStyle="#fff6d6"; ctx.beginPath(); ctx.arc(scx,scy,14,0,6.28); ctx.fill(); }
  // ground
  const night=isNight(p), base=night?[26,46,40]:[70,120,76]; const gg=ctx.createLinearGradient(0,GROUND,0,H); gg.addColorStop(0,rgb(mix(base,[20,34,28],0.1))); gg.addColorStop(1,rgb(mix(base,[12,22,18],0.6)));
  ctx.fillStyle=gg; ctx.fillRect(0,GROUND,W,H-GROUND);
  // a little pond
  ctx.fillStyle=night?"rgba(90,140,180,.5)":"rgba(150,205,225,.7)"; ctx.beginPath(); ctx.ellipse(W*0.26,GROUND+H*0.10,Math.min(W*0.22,90),Math.min(H*0.04,26),0,0,6.28); ctx.fill();
  drawDrops(dt); drawCreature(dt); drawBursts(dt); drawPops(dt);
  if(night){ ctx.fillStyle="rgba(8,12,28,.28)"; ctx.fillRect(0,0,W,H); }
  updateHud();
  saveT+=dt; if(saveT>5){ saveT=0; save(); }
  requestAnimationFrame(frame);
}

/* ============================== POINTER ================================= */
function onTap(ev){ ev.preventDefault(); const r=cv.getBoundingClientRect();
  const x=(ev.touches?ev.touches[0].clientX:ev.clientX)-r.left, y=(ev.touches?ev.touches[0].clientY:ev.clientY)-r.top;
  if(!AC) initAudio();
  // tap a dewdrop to gather it
  for(let i=drops.length-1;i>=0;i--){ const d=drops[i]; if(Math.hypot(x-d.x,y-d.y)<30){ if(used.gather<CAP.gather){ drops.splice(i,1); used.gather++; G.dewdrops=(G.dewdrops||0)+1;
    burst(d.x,d.y,"#e2f6ff"); popText(d.x,d.y,"+1 ✦","#bdecff"); ping(740); refreshCaps(); updateHud(); save(); } return; } }
  // tap the creature to pet
  const b=G.bloomling; if(b._cx!==undefined && Math.hypot(x-b._cx,y-(b._cy||GROUND))< (b._size||30)*1.8){ doPet(); }
}
cv.addEventListener("mousedown",onTap); cv.addEventListener("touchstart",onTap,{passive:false});

/* ============================== WHILE-AWAY CARD ========================= */
function showAway(){ const el=document.getElementById("away");
  const mins=away/60; let when = mins<2?"just now":mins<60?(Math.round(mins)+" min away"):mins<1440?(Math.round(mins/60)+"h away"):(Math.round(mins/1440)+"d away");
  document.getElementById("awayWhen").textContent=when;
  const b=G.bloomling; const gift=clamp(Math.floor(away/600),0,5); // a dewdrop per ~10 min away, up to 5
  const list=document.getElementById("awayList"); list.innerHTML="";
  const items = b.stage==="egg" ? ["the seed waited patiently for you 🥚"] : (awayEffects.length?awayEffects.slice():["it's been peaceful here 🌿"]);
  if(gift>0){ G.dewdrops=(G.dewdrops||0)+gift; items.push("it gathered <b>"+gift+" dewdrop"+(gift>1?"s":"")+"</b> for you ✦"); }
  for(const it of items){ const li=document.createElement("li"); li.innerHTML="• "+it; list.appendChild(li); }
  document.getElementById("awayTitle").textContent = b.name==="seedling"?"your seed is here":("welcome back to "+b.name);
  el.classList.remove("hidden");
  document.getElementById("awayOk").onclick=()=>{ el.style.opacity="0"; setTimeout(()=>el.classList.add("hidden"),500);
    if(b.stage!=="egg") spawnDrop(); save(); };
}

/* ============================== CROSS-TAB SYNC ========================== */
// if the full Glade (same origin) saves, reflect it here live.
window.addEventListener("storage", (e)=>{ if(e.key===SAVE_KEY && !suppressStorage && e.newValue){ try{ G=adopt(JSON.parse(e.newValue));
  G.bloomling.x=undefined; updateHud(); toast("✦ synced with the full Glade"); }catch(err){} } });

/* ============================== PWA ===================================== */
if("serviceWorker" in navigator){ window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }); }

/* ============================== BOOT ==================================== */
function boot(){ resize();
  const raw=loadRaw();
  if(raw){ G=adopt(raw); away=applyOfflineTime(); }
  else { G=newGame(); away=0; }
  initAudio();
  buildTreats(); refreshCaps(); updateHud();
  requestAnimationFrame(frame);
  if(away>60) showAway(); else if(G.bloomling.stage!=="egg"){ /* quiet return */ }
  save();
}
function buildTreats(){ const t=document.getElementById("treats"); t.innerHTML="";
  for(const e of ESSENCES){ const d=document.createElement("div"); d.className="tr"; d.title=e.name;
    d.innerHTML='<svg width="22" height="22" viewBox="0 0 28 28"><circle cx="14" cy="14" r="11" fill="none" stroke="'+(ALIGN_COLOR[e.align]||"#e6dfcf")+'" stroke-width="1.4" opacity=".8"/><circle cx="14" cy="15" r="7" fill="'+e.color+'"/></svg><div class="lb">'+e.name+'</div>';
    d.addEventListener("click",()=>doTreat(e.id)); t.appendChild(d); } }

document.getElementById("aPet").addEventListener("click",doPet);
document.getElementById("aGather").addEventListener("click",doGather);
document.getElementById("aTreat").addEventListener("click",toggleTreats);
document.addEventListener("visibilitychange",()=>{ if(document.hidden) save(); });
window.addEventListener("beforeunload",save);

boot();
</script>
