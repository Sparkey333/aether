[package]
name = "thirdthumb"
version = "0.1.0"
description = "ThirdThumb / GhostHands desktop app"
authors = ["ThirdThumb"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "thirdthumb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
# Tier-1 input injection: cross-platform keyboard/mouse simulation.
# Drives emulators (RetroArch, mGBA, Citra/Lime3DS, ...) via their keybinds.
enigo = "0.3"
