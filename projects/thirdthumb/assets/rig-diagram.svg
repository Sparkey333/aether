<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" role="img" aria-label="ThirdThumb physical rig concept">
  <rect width="640" height="380" rx="18" fill="#0d0f17"/>
  <text x="24" y="38" font-family="system-ui" font-size="18" font-weight="700" fill="#e8ebf5">Tier 3 — ThirdThumb Rig (physical, universal)</text>
  <text x="24" y="60" font-family="ui-monospace,monospace" font-size="12" fill="#9aa3bd">3D-printed clamp · 2 micro-servos / solenoids press real buttons · works on ANY controller</text>

  <!-- controller body -->
  <g transform="translate(150,120)">
    <rect x="0" y="40" width="340" height="150" rx="60" fill="#171a26" stroke="#242838" stroke-width="2"/>
    <!-- left stick + dpad -->
    <circle cx="70" cy="115" r="26" fill="#0a0b10"/>
    <g fill="#0a0b10"><rect x="118" y="100" width="14" height="42" rx="3"/><rect x="104" y="114" width="42" height="14" rx="3"/></g>
    <!-- face buttons -->
    <circle cx="262" cy="95" r="15" fill="#2a2f42"/><text x="262" y="100" text-anchor="middle" font-size="13" fill="#9aa3bd" font-family="system-ui">X</text>
    <circle cx="298" cy="125" r="15" fill="#ffd34e"/><text x="298" y="130" text-anchor="middle" font-size="13" fill="#0a0b10" font-family="system-ui" font-weight="700">A</text>
    <circle cx="226" cy="125" r="15" fill="#26d0ce"/><text x="226" y="130" text-anchor="middle" font-size="13" fill="#0a0b10" font-family="system-ui" font-weight="700">B</text>
    <circle cx="262" cy="155" r="15" fill="#2a2f42"/><text x="262" y="160" text-anchor="middle" font-size="13" fill="#9aa3bd" font-family="system-ui">Y</text>

    <!-- printed bridge / clamp -->
    <rect x="200" y="-8" width="150" height="22" rx="6" fill="#7c5cff" opacity=".85"/>
    <text x="275" y="7" text-anchor="middle" font-size="11" fill="#fff" font-family="ui-monospace,monospace">printed clamp</text>
    <!-- servo arms -->
    <line x1="298" y1="14" x2="298" y2="110" stroke="#26d0ce" stroke-width="6" stroke-linecap="round"/>
    <line x1="226" y1="14" x2="226" y2="110" stroke="#26d0ce" stroke-width="6" stroke-linecap="round"/>
    <circle cx="298" cy="14" r="9" fill="#171a26" stroke="#26d0ce" stroke-width="3"/>
    <circle cx="226" cy="14" r="9" fill="#171a26" stroke="#26d0ce" stroke-width="3"/>
    <text x="312" y="58" font-size="11" fill="#26d0ce" font-family="ui-monospace,monospace">servo → A</text>
    <text x="120" y="58" font-size="11" fill="#26d0ce" font-family="ui-monospace,monospace">servo → B</text>
  </g>

  <!-- brain box -->
  <g transform="translate(40,150)">
    <rect x="0" y="0" width="90" height="60" rx="8" fill="#12141d" stroke="#7c5cff" stroke-width="2"/>
    <text x="45" y="26" text-anchor="middle" font-size="11" fill="#e8ebf5" font-family="ui-monospace,monospace">RP2040</text>
    <text x="45" y="42" text-anchor="middle" font-size="10" fill="#9aa3bd" font-family="ui-monospace,monospace">+ USB</text>
  </g>
  <line x1="130" y1="180" x2="170" y2="180" stroke="#7c5cff" stroke-width="3" stroke-dasharray="4 3"/>

  <text x="320" y="350" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9aa3bd">Dashboard ⇄ USB serial ⇄ microcontroller ⇄ servos ⇄ buttons</text>
</svg>
