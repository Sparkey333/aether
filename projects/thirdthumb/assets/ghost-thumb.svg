<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img" aria-label="GhostHands mascot">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#1a1430"/><stop offset="1" stop-color="#0a0b10"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b49bff"/><stop offset="1" stop-color="#26d0ce"/>
    </linearGradient>
  </defs>
  <rect width="360" height="360" rx="28" fill="url(#bg)"/>
  <!-- aura -->
  <circle cx="180" cy="160" r="120" fill="#7c5cff" opacity="0.16"/>
  <!-- ghost body shaped like a thumb -->
  <g transform="translate(60,40)">
    <path d="M120 10C60 10 18 56 18 116v150l24-22 24 22 24-22 24 22 24-22 24 22V116C162 56 180 10 120 10z" fill="url(#body)" opacity="0.97"/>
    <!-- eyes -->
    <circle cx="92" cy="118" r="13" fill="#0a0b10"/><circle cx="148" cy="118" r="13" fill="#0a0b10"/>
    <circle cx="96" cy="114" r="4" fill="#fff"/><circle cx="152" cy="114" r="4" fill="#fff"/>
    <!-- happy mouth -->
    <path d="M104 150 q16 18 32 0" stroke="#0a0b10" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- the 'A' button it presses -->
    <circle cx="120" cy="232" r="26" fill="#0a0b10"/>
    <text x="120" y="241" text-anchor="middle" font-family="system-ui" font-size="26" font-weight="700" fill="#ffd34e">A</text>
  </g>
  <text x="180" y="338" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="14" letter-spacing="3" fill="#9aa3bd">GHOSTHANDS</text>
</svg>
